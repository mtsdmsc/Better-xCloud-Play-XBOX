name: Build & Attach Release Asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do build (ex.: 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build Userscript
        run: |
          bun run build.ts --version "${{ steps.ver.outputs.version }}" --meta

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playxbox-enhanced-v${{ steps.ver.outputs.version }}
          path: |
            dist/playxbox-enhanced.user.js
            dist/playxbox-enhanced.meta.js

      - name: Publish / Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PlayXbox Enhanced ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/playxbox-enhanced.user.js

